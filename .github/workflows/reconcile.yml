name: Check documentation alignment
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with: {path: wiki}
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with: {repository: ramideltoro/pricedip, path: app}
      - uses: actions/setup-node@db0fb3a98ed314b69026b6e8c9be26a7e2fe65a8
        with: {node-version: '22.22.1'}
      - run: node app/scripts/docs.mjs check wiki app
